name: .NET CI

on:
  push:
    branches:
      - main
      - release
      - develop
      - feature/**
      - bugfix/**

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: List the sdks
        run: dotnet --list-sdks

      - name: Restore dependencies
        run: dotnet restore Xunit.TestLogger.sln

      - name: Build Solution
        run: dotnet build Xunit.TestLogger.sln --configuration Release --no-restore

      - name: Run Tests
        id: tests
        run: dotnet test Xunit.TestLogger.sln --configuration Release --no-build --verbosity normal --logger trx

      - name: Publish Artifact Test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'
          if-no-files-found: ignore

      # Report after a failed test run too, but not when restore/build already failed (nothing to report)
      - name: Publish Test Results
        if: always() && steps.tests.conclusion != 'skipped'
        uses: dorny/test-reporter@v3
        with:
          name: 'Test Results'
          path: '**/TestResults/**/*.trx'
          reporter: 'dotnet-trx'

  package:
    name: Package
    needs: build_and_test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: List the sdks
        run: dotnet --list-sdks

      - name: Restore dependencies
        run: dotnet restore Xunit.TestLogger.sln

      - name: Build Solution
        run: dotnet build Xunit.TestLogger.sln --configuration Release --no-restore

      - name: Pack
        run: dotnet pack ConnectingApps.Xunit.TestLogger/ConnectingApps.Xunit.TestLogger.csproj --configuration Release --no-build -o out

      - name: Find package file
        run: find | grep 'nupkg'

      - name: Publish Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: out/*.nupkg

      - name: NuGet login
        if: github.ref == 'refs/heads/main'
        id: login
        uses: NuGet/login@v1
        with:
          user: DaanAcohen

      - name: Publish to NuGet
        if: github.ref == 'refs/heads/main'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "out/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
